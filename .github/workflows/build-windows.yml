name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Determine app version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/") {
            # tag 名去掉开头的 v，例如 v1.9.1 → 1.9.1
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            # 手动触发或普通分支，用固定版本，避免 master 这种非法值
            $v = "1.0.0"
          }
          Write-Host "app-version = $v"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Create EXE with jpackage
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path target -Filter "*.jar" |
                 Where-Object { $_.Name -notlike "*-sources*" -and $_.Name -notlike "*-javadoc*" } |
                 Select-Object -First 1
          if (-not $jar) { throw "找不到 jar 包，请检查 mvn package 结果" }
          Write-Host "使用 jar: $($jar.FullName)"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          jpackage `
            --type app-image `
            --name TChess `
            --input target `
            --main-jar $jar.Name `
            --main-class com.sojourners.chess.Main `
            --dest dist `
            --java-options "-Dfile.encoding=UTF-8" `
            --app-version ${{ steps.ver.outputs.version }} `
            --vendor "TChess" `
            --description "TChess Xiangqi GUI"

      - name: Zip the app-image
        shell: pwsh
        run: |
          Compress-Archive -Path dist\TChess\* -DestinationPath dist\TChess-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TChess-Windows
          path: dist/TChess-Windows.zip

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TChess-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
