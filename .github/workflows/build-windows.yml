name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Determine app version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $v = "1.0.0"
          }
          Write-Host "app-version = $v"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # Windows 上必须指定 JavaFX 平台，否则可能下到错误原生库
      - name: Build + jlink (with JavaFX)
        shell: pwsh
        run: |
          mvn -B clean package javafx:jlink "-DskipTests" "-Djavafx.platform=win"

      - name: Check jlink output
        shell: pwsh
        run: |
          if (-not (Test-Path "target\image")) {
            Write-Host "target\image 不存在，列出 target 目录："
            Get-ChildItem target -Recurse -Depth 2 | Select-Object FullName
            throw "jlink 没有生成 target/image，请检查上面 Maven 日志"
          }
          Write-Host "jlink 输出目录内容："
          Get-ChildItem target\image | Format-Table Name, Length

      - name: Create EXE with jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 用 jlink 生成的 runtime-image，而不是瘦 jar
          jpackage `
            --type app-image `
            --name TChess `
            --runtime-image target\image `
            --module Xiangqi/com.sojourners.chess.Main `
            --dest dist `
            --app-version ${{ steps.ver.outputs.version }} `
            --vendor "TChess" `
            --description "TChess Xiangqi GUI" `
            --java-options "-Dfile.encoding=UTF-8"

      - name: Zip the app-image
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\TChess")) {
            throw "dist\TChess 不存在，jpackage 可能失败"
          }
          Compress-Archive -Path dist\TChess\* -DestinationPath dist\TChess-Windows.zip -Force
          Write-Host "产物大小："
          Get-Item dist\TChess-Windows.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TChess-Windows
          path: dist/TChess-Windows.zip

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TChess-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
