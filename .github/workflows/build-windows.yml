name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Determine app version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $v = "1.0.0"
          }
          Write-Host "app-version = $v"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Maven package
        shell: pwsh
        run: |
          mvn -B clean package "-DskipTests" "-Djavafx.platform=win"

      - name: Copy runtime jars
        shell: pwsh
        run: |
          mvn -B dependency:copy-dependencies `
            "-DoutputDirectory=target/app-input" `
            "-DincludeScope=runtime" `
            "-Djavafx.platform=win"

          Copy-Item "target\Xiangqi-1.0-SNAPSHOT.jar" "target\app-input\" -Force

          Write-Host "app-input 内容："
          Get-ChildItem target\app-input | Select-Object Name, Length

      - name: Create EXE with jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          jpackage `
            --type app-image `
            --name TChess `
            --input "target\app-input" `
            --main-jar "Xiangqi-1.0-SNAPSHOT.jar" `
            --main-class "com.sojourners.chess.Main" `
            --dest dist `
            --app-version "${{ steps.ver.outputs.version }}" `
            --vendor "TChess" `
            --description "TChess Xiangqi GUI" `
            --win-console `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "--module-path=`$APPDIR" `
            --java-options "--add-modules=javafx.controls,javafx.fxml,javafx.graphics,javafx.media,javafx.swing"

          Write-Host "检查 dist\TChess 结构："
          Get-ChildItem dist\TChess | Select-Object Name
          Get-ChildItem dist\TChess\runtime\bin -ErrorAction SilentlyContinue | Select-Object Name

          if (-not (Test-Path "dist\TChess\runtime\bin\java.exe")) {
            Write-Host "runtime\bin 完整列表："
            Get-ChildItem "dist\TChess\runtime\bin" -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "jpackage 产物缺少 java.exe，打包不完整"
          }

          if (-not (Test-Path "dist\TChess\TChess.exe")) {
            throw "缺少 TChess.exe"
          }

      - name: Zip the app-image
        shell: pwsh
        run: |
          # 打整个文件夹，避免漏文件
          if (Test-Path dist\TChess-Windows.zip) { Remove-Item dist\TChess-Windows.zip -Force }
          Compress-Archive -Path dist\TChess -DestinationPath dist\TChess-Windows.zip -Force
          Get-Item dist\TChess-Windows.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TChess-Windows
          path: dist/TChess-Windows.zip

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TChess-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
