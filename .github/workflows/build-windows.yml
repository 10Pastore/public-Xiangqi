name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Determine app version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $v = "1.0.0"
          }
          Write-Host "app-version = $v"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Maven package
        shell: pwsh
        run: |
          mvn -B clean package "-DskipTests" "-Djavafx.platform=win"

      - name: Copy runtime jars
        shell: pwsh
        run: |
          # 所有运行依赖（含 JavaFX win 原生库）
          mvn -B dependency:copy-dependencies `
            "-DoutputDirectory=target/app-input" `
            "-DincludeScope=runtime" `
            "-Djavafx.platform=win"

          # 主程序 jar
          Copy-Item "target\Xiangqi-1.0-SNAPSHOT.jar" "target\app-input\" -Force

          Write-Host "app-input 内容："
          Get-ChildItem target\app-input | Select-Object Name, Length

      - name: Create EXE with jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          jpackage `
            --type app-image `
            --name TChess `
            --module-path "target\app-input" `
            --module "Xiangqi/com.sojourners.chess.Main" `
            --dest dist `
            --app-version "${{ steps.ver.outputs.version }}" `
            --vendor "TChess" `
            --description "TChess Xiangqi GUI" `
            --java-options "-Dfile.encoding=UTF-8"

      - name: Zip the app-image
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\TChess")) {
            Write-Host "dist 目录内容："
            Get-ChildItem dist -Recurse -Depth 2 | Select-Object FullName
            throw "dist\TChess 不存在，jpackage 失败"
          }
          Compress-Archive -Path dist\TChess\* -DestinationPath dist\TChess-Windows.zip -Force
          Get-Item dist\TChess-Windows.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TChess-Windows
          path: dist/TChess-Windows.zip

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TChess-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
